name: Recolección diaria 8:00 (Bogotá)

on:
  schedule:
    # RESPALDO. El disparador principal es externo (cron-job.org -> workflow_dispatch modo=programado),
    # porque el cron de GitHub llegó con 8-10 h de retraso el 16-18 nov. Si ya corrió hoy, se omite.
    - cron: "40 12 16-21 11 *"
    - cron: "10 14 19-21 11 *"
  workflow_dispatch:
    inputs:
      modo:
        description: "programado (disparador externo: real + hora exacta + 1 vez al día), real o prueba"
        default: prueba
        type: choice
        options: [prueba, real, programado]

permissions:
  contents: write

concurrency:
  group: datos-corolla   # nunca dos ejecuciones escribiendo a la vez
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COROLLA_MODO: ${{ (github.event_name == 'schedule' || inputs.modo == 'programado') && 'real' || inputs.modo }}
      PROGRAMADO: ${{ (github.event_name == 'schedule' || inputs.modo == 'programado') && '1' || '0' }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Pipeline (búsqueda, descarga, consolidación)
        run: |
          # Programado (cron de respaldo o disparador externo): hora exacta y una sola vez al día
          if [ "$PROGRAMADO" = "1" ]; then EXTRA="--esperar-hasta 08:00 --una-vez"; fi
          python -m corolla.pipeline --modo "$COROLLA_MODO" $EXTRA

      - name: Guardar datos en el repositorio
        if: always()   # aunque falle el pipeline, se guarda la evidencia y el log
        run: |
          git config user.name "corolla-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CARPETAS=$(ls -d datos logs reportes pruebas 2>/dev/null || true)
          [ -n "$CARPETAS" ] && git add -A -- $CARPETAS
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "datos ${COROLLA_MODO} $(TZ=America/Bogota date +%Y-%m-%dT%H:%M%z)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
